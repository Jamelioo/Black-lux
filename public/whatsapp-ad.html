<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Luxury 242 - WhatsApp Ad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .ad {
      width: 1080px;
      height: 1920px;
      background: #0a0a0a;
      position: relative;
      overflow: hidden;
      transform-origin: top center;
      scale: 0.35;
      margin: -624px 0;
    }

    @media (max-width: 768px) {
      .ad {
        width: 100vw;
        height: 177.78vw;
        scale: 1;
        margin: 0;
      }
    }

    /* Background effects */
    .ad::before {
      content: '';
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 140%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(201, 169, 78, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .ad::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, rgba(201, 169, 78, 0.05) 0%, transparent 100%);
      pointer-events: none;
    }

    /* Decorative lines */
    .border-frame {
      position: absolute;
      inset: 40px;
      border: 1px solid rgba(201, 169, 78, 0.15);
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: #c9a94e;
    }
    .corner::before { width: 30px; height: 2px; }
    .corner::after { width: 2px; height: 30px; }
    .corner.tl { top: 30px; left: 30px; }
    .corner.tr { top: 30px; right: 30px; }
    .corner.tr::before { right: 0; }
    .corner.tr::after { right: 0; }
    .corner.bl { bottom: 30px; left: 30px; }
    .corner.bl::before { bottom: 0; }
    .corner.bl::after { bottom: 0; }
    .corner.br { bottom: 30px; right: 30px; }
    .corner.br::before { right: 0; bottom: 0; }
    .corner.br::after { right: 0; bottom: 0; }

    /* Vertical line accents */
    .line-left, .line-right {
      position: absolute;
      width: 1px;
      height: 200px;
      background: linear-gradient(to bottom, transparent, #c9a94e, transparent);
      opacity: 0.3;
    }
    .line-left { left: 80px; top: 50%; transform: translateY(-50%); }
    .line-right { right: 80px; top: 50%; transform: translateY(-50%); }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 80px;
      text-align: center;
    }

    .est-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: #c9a94e;
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 60px;
      font-style: italic;
      opacity: 0.8;
    }

    .logo-group {
      margin-bottom: 70px;
    }

    .logo-black {
      font-family: 'Playfair Display', serif;
      font-size: 110px;
      font-weight: 800;
      color: #fafafa;
      letter-spacing: 16px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .logo-luxury {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      color: #c9a94e;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 14px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .logo-242 {
      font-family: 'Inter', sans-serif;
      font-size: 24px;
      color: #c9a94e;
      letter-spacing: 20px;
      font-weight: 300;
      opacity: 0.6;
    }

    .divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a94e, transparent);
      margin: 50px auto;
    }

    .tagline {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 700;
      color: #fafafa;
      line-height: 1.3;
      margin-bottom: 30px;
      max-width: 750px;
    }

    .tagline em {
      color: #c9a94e;
      font-style: italic;
    }

    .sub-text {
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      color: #888;
      font-weight: 300;
      line-height: 1.7;
      max-width: 650px;
      margin-bottom: 70px;
    }

    /* Services pills */
    .services-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 80px;
    }

    .pill {
      padding: 14px 32px;
      border: 1px solid rgba(201, 169, 78, 0.4);
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c9a94e;
      font-weight: 400;
    }

    /* CTA */
    .cta {
      padding: 24px 60px;
      background: #c9a94e;
      color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 50px;
    }

    .website {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      color: #888;
      letter-spacing: 4px;
      font-weight: 300;
    }

    /* Diamond decorations */
    .diamond {
      width: 10px;
      height: 10px;
      background: #c9a94e;
      transform: rotate(45deg);
      margin: 0 auto 40px;
      opacity: 0.6;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #c9a94e;
      border-radius: 50%;
      opacity: 0.3;
    }
    .p1 { top: 15%; left: 20%; }
    .p2 { top: 25%; right: 15%; opacity: 0.2; }
    .p3 { top: 60%; left: 12%; }
    .p4 { top: 70%; right: 18%; opacity: 0.15; }
    .p5 { top: 85%; left: 30%; opacity: 0.25; }
    .p6 { top: 40%; right: 25%; }
    .p7 { top: 45%; left: 25%; opacity: 0.2; }
  </style>
</head>
<body>
  <div class="ad">
    <div class="border-frame"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="line-left"></div>
    <div class="line-right"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>

    <div class="content">
      <div class="est-tag">Libreville, Gabon</div>

      <div class="logo-group">
        <div class="logo-black">BLACK</div>
        <div class="logo-luxury">Luxury</div>
        <div class="logo-242">242</div>
      </div>

      <div class="divider"></div>

      <div class="diamond"></div>

      <div class="tagline">
        Redefining <em>Luxury</em><br>in Central Africa
      </div>

      <div class="sub-text">
        Premium lifestyle consulting, exclusive events,
        fashion & bespoke experiences
      </div>

      <div class="services-row">
        <div class="pill">Events</div>
        <div class="pill">Fashion</div>
        <div class="pill">Travel</div>
        <div class="pill">Dining</div>
      </div>

      <div class="cta">Book Now</div>

      <div class="website">blackluxury242.com</div>
    </div>
  </div>
</body>
</html>
